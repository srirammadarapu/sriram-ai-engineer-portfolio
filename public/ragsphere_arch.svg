<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" style="background:#0a0a0b;font-family:Inter,sans-serif;">
  <defs>
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arr-c" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06b6d4"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700" font-family="Outfit,sans-serif">RAGSphere Pipeline</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Advanced Enterprise RAG with Hybrid Retrieval &amp; Evaluation</text>

  <!-- ═══ TOP SECTION: QUERY PIPELINE ═══ -->
  <text x="450" y="88" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="600" letter-spacing="2">QUERY PIPELINE</text>

  <!-- User Query -->
  <rect x="20" y="100" width="90" height="55" rx="10" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow-blue)"/>
  <text x="65" y="124" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">User</text>
  <text x="65" y="142" text-anchor="middle" fill="#3b82f6" font-size="11">Query</text>

  <line x1="110" y1="127" x2="145" y2="127" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Query Expansion -->
  <rect x="145" y="100" width="105" height="55" rx="10" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="197" y="122" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Query</text>
  <text x="197" y="138" text-anchor="middle" fill="#8b5cf6" font-size="10">Expansion</text>
  <text x="197" y="151" text-anchor="middle" fill="#64748b" font-size="8">HyDE + Multi-Query</text>

  <line x1="250" y1="127" x2="285" y2="107" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <line x1="250" y1="127" x2="285" y2="148" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Semantic Search -->
  <rect x="285" y="82" width="110" height="48" rx="10" fill="rgba(6,182,212,0.12)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="340" y="102" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600">Semantic Search</text>
  <text x="340" y="118" text-anchor="middle" fill="#06b6d4" font-size="9">Qdrant Vector DB</text>

  <!-- BM25 Search -->
  <rect x="285" y="138" width="110" height="48" rx="10" fill="rgba(6,182,212,0.12)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="340" y="158" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600">BM25 Search</text>
  <text x="340" y="174" text-anchor="middle" fill="#06b6d4" font-size="9">Keyword Retrieval</text>

  <line x1="395" y1="106" x2="430" y2="127" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-c)"/>
  <line x1="395" y1="162" x2="430" y2="148" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-c)"/>

  <!-- RRF -->
  <rect x="430" y="100" width="95" height="55" rx="10" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="477" y="122" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">RRF Fusion</text>
  <text x="477" y="138" text-anchor="middle" fill="#f59e0b" font-size="9">Reciprocal Rank</text>
  <text x="477" y="151" text-anchor="middle" fill="#64748b" font-size="8">Score Merging</text>

  <line x1="525" y1="127" x2="558" y2="127" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Cross-Encoder Reranker -->
  <rect x="558" y="100" width="110" height="55" rx="10" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="613" y="122" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600">Cross-Encoder</text>
  <text x="613" y="136" text-anchor="middle" fill="#ef4444" font-size="10">Reranker</text>
  <text x="613" y="150" text-anchor="middle" fill="#64748b" font-size="8">ms-marco model</text>

  <line x1="668" y1="127" x2="700" y2="127" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Context Builder -->
  <rect x="700" y="100" width="95" height="55" rx="10" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.5"/>
  <text x="747" y="120" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600">Context</text>
  <text x="747" y="134" text-anchor="middle" fill="#10b981" font-size="10">Window</text>
  <text x="747" y="150" text-anchor="middle" fill="#64748b" font-size="8">Parent Chunk</text>

  <line x1="795" y1="127" x2="828" y2="127" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- LLM Generation -->
  <rect x="828" y="100" width="55" height="55" rx="10" fill="rgba(59,130,246,0.2)" stroke="#3b82f6" stroke-width="2" filter="url(#glow-blue)"/>
  <text x="855" y="122" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="700">LLM</text>
  <text x="855" y="138" text-anchor="middle" fill="#3b82f6" font-size="9">GPT-4o</text>

  <!-- Response arrow -->
  <path d="M855 155 L855 195 L65 195 L65 175" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-g)" fill="none"/>
  <text x="460" y="210" text-anchor="middle" fill="#10b981" font-size="10">✓ Final Response</text>

  <!-- ═══ MIDDLE SECTION: INGESTION PIPELINE ═══ -->
  <line x1="20" y1="235" x2="880" y2="235" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="256" text-anchor="middle" fill="#8b5cf6" font-size="10" font-weight="600" letter-spacing="2">DOCUMENT INGESTION PIPELINE</text>

  <!-- Documents -->
  <rect x="20" y="272" width="100" height="65" rx="10" fill="rgba(139,92,246,0.1)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="70" y="294" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Documents</text>
  <text x="70" y="310" text-anchor="middle" fill="#8b5cf6" font-size="9">PDF / Tables</text>
  <text x="70" y="324" text-anchor="middle" fill="#64748b" font-size="9">Images / HTML</text>

  <line x1="120" y1="304" x2="155" y2="304" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Unstructured Parser -->
  <rect x="155" y="272" width="110" height="65" rx="10" fill="rgba(139,92,246,0.1)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="210" y="295" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600">Unstructured</text>
  <text x="210" y="310" text-anchor="middle" fill="#8b5cf6" font-size="10">Parser</text>
  <text x="210" y="328" text-anchor="middle" fill="#64748b" font-size="8">Multi-modal Extract</text>

  <line x1="265" y1="304" x2="300" y2="304" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Embedding Model -->
  <rect x="300" y="272" width="110" height="65" rx="10" fill="rgba(6,182,212,0.1)" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="355" y="295" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600">Embedding</text>
  <text x="355" y="310" text-anchor="middle" fill="#06b6d4" font-size="10">Model</text>
  <text x="355" y="328" text-anchor="middle" fill="#64748b" font-size="8">text-embedding-3</text>

  <line x1="410" y1="304" x2="445" y2="304" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr-c)"/>

  <!-- Parent-Child Chunking -->
  <rect x="445" y="272" width="115" height="65" rx="10" fill="rgba(245,158,11,0.1)" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="502" y="295" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="600">Parent-Child</text>
  <text x="502" y="310" text-anchor="middle" fill="#f59e0b" font-size="10">Chunking</text>
  <text x="502" y="328" text-anchor="middle" fill="#64748b" font-size="8">Hierarchical Index</text>

  <line x1="560" y1="304" x2="595" y2="304" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Qdrant -->
  <rect x="595" y="272" width="100" height="65" rx="10" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="2" filter="url(#glow-cyan)"/>
  <text x="645" y="296" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">Qdrant</text>
  <text x="645" y="312" text-anchor="middle" fill="#10b981" font-size="10">Vector Store</text>
  <text x="645" y="328" text-anchor="middle" fill="#64748b" font-size="8">HNSW Index</text>

  <!-- Qdrant connects back up to Semantic Search -->
  <path d="M645 272 L645 162 L395 162" stroke="rgba(16,185,129,0.4)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-g)" fill="none"/>

  <!-- ═══ EVALUATION MODULE ═══ -->
  <rect x="718" y="260" width="162" height="100" rx="12" fill="rgba(59,130,246,0.06)" stroke="rgba(59,130,246,0.3)" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="799" y="282" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="600">RAGAS EVALUATION</text>
  <text x="799" y="302" text-anchor="middle" fill="#f8fafc" font-size="11">📊 Faithfulness</text>
  <text x="799" y="318" text-anchor="middle" fill="#f8fafc" font-size="11">🎯 Context Precision</text>
  <text x="799" y="334" text-anchor="middle" fill="#f8fafc" font-size="11">📈 Answer Relevancy</text>
  <text x="799" y="350" text-anchor="middle" fill="#94a3b8" font-size="9">Automated Benchmarking</text>

  <!-- Evaluation arrow from LLM -->
  <path d="M855 155 L855 290 L880 290" stroke="rgba(59,130,246,0.3)" stroke-width="1" stroke-dasharray="4,3" fill="none"/>

  <!-- Impact Stats -->
  <rect x="20" y="380" width="860" height="60" rx="10" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="450" y="402" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600" letter-spacing="2">KEY METRICS &amp; RESULTS</text>
  <text x="180" y="428" text-anchor="middle" fill="#10b981" font-size="16" font-weight="700">40%</text>
  <text x="180" y="444" text-anchor="middle" fill="#94a3b8" font-size="9">Retrieval Accuracy Improvement</text>
  <text x="450" y="428" text-anchor="middle" fill="#3b82f6" font-size="16" font-weight="700">5-Stage</text>
  <text x="450" y="444" text-anchor="middle" fill="#94a3b8" font-size="9">Multi-Phase RAG Pipeline</text>
  <text x="720" y="428" text-anchor="middle" fill="#8b5cf6" font-size="16" font-weight="700">3 Modalities</text>
  <text x="720" y="444" text-anchor="middle" fill="#94a3b8" font-size="9">Text · Tables · Images</text>
</svg>
